<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Each allowance below is here for one reason and no more:

      img-src data:     Remote pointers arrive as pixels and are turned into CSS
                        cursors through a canvas, which produces a data: URL.
      connect-src ws://127.0.0.1:*  Vite's hot reload, in development only. A
                        packaged build has no dev server and opens no socket
                        from the window at all. Loopback either way — no host
                        beyond this machine is reachable from here.

      Three allowances left with the previous RDP client, which ran as
      WebAssembly inside this window: 'wasm-unsafe-eval' to compile it,
      connect-src data: to fetch the module out of a data URL, and img-src blob:.
      The desktop client is now a program of its own and the window runs no
      WebAssembly, so the window may no longer compile any.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*;"
    />
    <title>TerminalDeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
