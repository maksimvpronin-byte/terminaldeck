appId: com.terminaldeck.app
# Runs after the .app is assembled and before the disk image is made from it.
# It signs the bundle ad-hoc when no certificate is configured — see the file
# for why an unsigned build does not merely warn on Apple Silicon, it refuses to
# start, and is reported as a damaged download.
afterPack: resources/adhoc-sign.js
productName: TerminalDeck
publish:
  provider: github
  owner: maksimvpronin-byte
  repo: terminaldeck
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/ssh2/**'
# Nothing this app ships is compiled. ssh2's only native dependency is
# `cpu-features`, which it marks optional and loads in a try/catch — it picks a
# cipher by what the CPU can do, and without it ssh2 picks one by itself, which
# is what every run in development already does. Left on, electron-builder hands
# every module in the tree to node-gyp, which downloads Electron's headers to
# build one that was never needed: a release then cannot be built without the
# network, and a slow network fails it outright.
npmRebuild: false
mac:
  icon: resources/icon.png
  # The desktop client and the FreeRDP libraries it loads. Built by
  # `npm run build:freerdp:mac` and made portable by `build:freerdp:bundle`,
  # which `build:mac` runs first so a build without them fails loudly rather
  # than shipping an application whose desktop panes cannot open.
  #
  # Only td-rdp travels. The SDL clients in the same directory are for proving
  # the build by hand and have no business in a release.
  extraResources:
    - from: resources/freerdp/build/macos-${arch}/bin/td-rdp
      to: freerdp/bin/td-rdp
    - from: resources/freerdp/build/macos-${arch}/lib
      to: freerdp/lib
      filter:
        - '*.dylib'
  # Apple Silicon only, for as long as the desktop client is built by the runner
  # that packages it. `macos-latest` is arm64, so an x64 package would either
  # carry an arm64 client or fail on a path that does not exist — and the first
  # of those is the sort of thing that ships and then does not run.
  #
  # Restoring Intel means a second macOS job on an x64 runner, each building its
  # own client and packaging its own architecture.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # Required for a hardened-runtime app that loads native modules (ssh2's crypto).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # From electron-builder 26 the Apple environment variables switch notarization
  # on by themselves, and `false` is the one value that overrides them. Delete
  # this line once APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID exist.
  notarize: false
win:
  icon: resources/icon.png
  # Shadow sessions are drawn by a window this app positions rather than paints,
  # and ShadowHost.exe is what holds it. Windows only, because shadowing is.
  # Built by `npm run build:shadowhost`, which build:win runs first.
  extraResources:
    - from: resources/shadowhost/ShadowHost.exe
      to: shadowhost/ShadowHost.exe
    # The desktop client and the libraries it needs. Windows looks for those
    # beside the executable, so they travel into the same directory rather than
    # a lib/ of their own — see bundle-windows.ps1, which puts them there.
    - from: resources/freerdp/build/windows-${arch}/bin
      to: freerdp/bin
      filter:
        - 'td-rdp.exe'
        - '*.dll'
  # x64 only, for the reason the macOS block gives: `windows-latest` is x64, and
  # the client it builds is the client that travels.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Named without spaces, because the name is also a URL.
  #
  # The default here is "TerminalDeck Setup 0.9.1.exe". electron-builder writes
  # the hyphenated form into `latest.yml` — which is what the updater fetches —
  # and used to rename the file to match as it uploaded. Now that the release is
  # assembled with `gh`, the file goes up under the name it has on disk, and
  # GitHub turns the spaces into dots: the updater then asked for
  # `TerminalDeck-Setup-0.9.1.exe` and the release held
  # `TerminalDeck.Setup.0.9.1.exe`. A 404, and a silent one, since a failed
  # update shows nothing. A name with no spaces in it cannot drift.
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Development
  # .deb refuses to build without one; the GitHub noreply address keeps a personal
  # address out of a publicly distributed package.
  maintainer: TerminalDeck <maksimvpronin-byte@users.noreply.github.com>
