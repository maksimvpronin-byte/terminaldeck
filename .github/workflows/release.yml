name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder creates the release and uploads to it; the default token is
# read-only in repositories created after the permissions change.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `freerdp` names the build script for the desktop client, and an
          # empty one means this platform has none yet — which is Linux, where
          # a pane says the client is missing rather than opening.
          - os: macos-latest
            script: build:mac
            freerdp: mac
            shim: build:freerdp:shim
            # Hashed into the cache key. Only this platform's own recipe: with
            # every script in one hash, editing the Windows one threw away the
            # macOS cache and cost half an hour for a file it never reads.
            recipe: resources/freerdp/build-macos.sh
          - os: windows-latest
            script: build:win
            freerdp: win
            shim: build:freerdp:win:shim
            recipe: resources/freerdp/build-windows.ps1
          - os: ubuntu-latest
            script: build:linux
            freerdp: ''
            shim: ''
            recipe: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-updater compares against the version baked into the app from
      # package.json, not against the tag. A tag that disagrees with it publishes
      # a release nobody is ever offered, so fail here rather than after three
      # runners have spent ten minutes building it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag, package.json says $pkg. Bump one to match the other."
            exit 1
          fi
          echo "Tag and package.json agree on $pkg."

      # The rest of what a release has to be true about itself: the changelog
      # section the notes are cut from, the signing hook, the space-free
      # artifact names, and the rule that one job and only one creates the
      # release. Each of these is a release that went out broken and green.
      - name: Verify the release contract
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release.cjs --tag "$GITHUB_REF_NAME"

      # ---------------------------------------------------------------- the
      # desktop client, which is compiled rather than downloaded and is the one
      # thing here a runner cannot get from npm.
      #
      # Cached on the FreeRDP version and the scripts that build it, not on the
      # shim's sources: FreeRDP takes half an hour and changes when its version
      # does, while the shim takes seconds and changes often. A cache hit skips
      # the first and still rebuilds the second, so a change to our own C is
      # never served from a stale cache.
      # Two caches rather than one. vcpkg is a package manager, and the packages
      # it installs do not depend on how we go on to build FreeRDP, so it is
      # keyed loosely and restored even when the recipe has changed — that is
      # the ten minutes of dependency building. FreeRDP's own output is keyed on
      # the recipe exactly: restoring it across a change to the build flags
      # would hand the run a library built to instructions we no longer give.
      - name: Cache vcpkg
        if: matrix.freerdp == 'win'
        uses: actions/cache@v4
        with:
          path: resources/freerdp/vcpkg
          key: vcpkg-${{ matrix.os }}-${{ hashFiles(matrix.recipe) }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Cache the desktop client
        if: matrix.freerdp != ''
        id: freerdp
        uses: actions/cache@v4
        with:
          path: resources/freerdp/build
          key: freerdp-3.31.0-${{ matrix.os }}-${{ hashFiles(matrix.recipe, 'resources/freerdp/shim/CMakeLists.txt') }}

      - name: Install what FreeRDP is built against
        if: matrix.freerdp == 'mac' && steps.freerdp.outputs.cache-hit != 'true'
        run: brew install cmake ninja pkg-config openssl@3 openh264 opus

      - name: Build the desktop client
        if: matrix.freerdp != '' && steps.freerdp.outputs.cache-hit != 'true'
        # Without the SDL client: it exists to prove a build by hand and is
        # never shipped, so a release has no use for it.
        env:
          FREERDP_SDL: '0'
        run: npm run build:freerdp:${{ matrix.freerdp }}

      # Always, and cheap: seconds against the FreeRDP the step above built or
      # the cache restored, so our own C is never the stale half of a hit.
      - name: Rebuild the shim
        if: matrix.freerdp != ''
        run: npm run ${{ matrix.shim }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Checks runs these on every push, so a tagged commit has usually been
      # through them already. Repeated here because this is the workflow that
      # publishes: a release should not be built from a tree whose tests fail,
      # whichever route the tag took.
      - name: Tests
        run: npm test

      # A missing secret expands to an empty string rather than being unset, and
      # electron-builder reads an empty CSC_LINK as a certificate path — failing
      # with "not a file". So the signing variables are only exported when set.
      - name: Configure signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the supplied certificate."
          else
            # Also stops electron-builder from hunting for an identity in the keychain.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No certificate configured — producing an unsigned build."
          fi
          if [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      # Built here, published in one job at the end — see `release` below for
      # why electron-builder is never allowed to do the uploading itself.
      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never

      # Before it is wrapped in a disk image, while the bundle is still a
      # directory this can read. An unsigned bundle is what macOS calls damaged.
      - name: Verify the macOS signature
        if: matrix.os == 'macos-latest'
        run: node scripts/verify-release.cjs --app dist/mac-arm64/TerminalDeck.app

      - name: Keep what was built
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          # The packages and the update metadata, and none of the directories
          # they were made from: `dist/` also holds the unpacked application,
          # which is the same bytes again and several times the size.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ the
  # release itself, assembled once, by one job, from what the three built.
  #
  # electron-builder used to upload straight from each runner, and could not be
  # made to put everything in one place. It looks a release up by tag — and a
  # draft has no published tag, so `GET /releases/tags/v0.9.1` answers 404 for a
  # release that plainly exists. Every publish that asks is therefore told there
  # is none, and creates one. It is not a race between the runners: v0.9.1 was
  # built one runner at a time and still came out in two drafts, with a disk
  # image in one of them and its blockmap in the other, because a single runner
  # publishes several groups of artifacts at once and each asked the same
  # question. Whether a release came out whole was down to timing, and v0.9.0
  # was simply lucky.
  #
  # So nothing publishes until everything is built, and then one job does it
  # with one command. A run that is not a tag skips this and leaves the packages
  # on the run itself, which is what makes Run workflow a way to test a build.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # Checked out for the verifier below; the packages themselves arrive from
      # the build jobs rather than from the repository.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # The payload itself: every kind of artifact present exactly once, every
      # name carrying the version, and every file the update metadata names
      # actually present under that name. v0.9.1 failed both halves — drafted
      # twice with the artifacts split, and a Windows installer whose name did
      # not match the one `latest.yml` asked for.
      - name: Verify the release payload
        run: |
          node scripts/verify-release.cjs \
            --version "${GITHUB_REF_NAME#v}" \
            --release-dir packages

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes \
            packages/*
