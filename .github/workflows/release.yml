name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder creates the release and uploads to it; the default token is
# read-only in repositories created after the permissions change.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `freerdp` names the build script for the desktop client, and an
          # empty one means this platform has none yet — which is Linux, where
          # a pane says the client is missing rather than opening.
          - os: macos-latest
            script: build:mac
            freerdp: mac
            shim: build:freerdp:shim
            # Hashed into the cache key. Only this platform's own recipe: with
            # every script in one hash, editing the Windows one threw away the
            # macOS cache and cost half an hour for a file it never reads.
            recipe: resources/freerdp/build-macos.sh
          - os: windows-latest
            script: build:win
            freerdp: win
            shim: build:freerdp:win:shim
            recipe: resources/freerdp/build-windows.ps1
          - os: ubuntu-latest
            script: build:linux
            freerdp: ''
            shim: ''
            recipe: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-updater compares against the version baked into the app from
      # package.json, not against the tag. A tag that disagrees with it publishes
      # a release nobody is ever offered, so fail here rather than after three
      # runners have spent ten minutes building it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag, package.json says $pkg. Bump one to match the other."
            exit 1
          fi
          echo "Tag and package.json agree on $pkg."

      # ---------------------------------------------------------------- the
      # desktop client, which is compiled rather than downloaded and is the one
      # thing here a runner cannot get from npm.
      #
      # Cached on the FreeRDP version and the scripts that build it, not on the
      # shim's sources: FreeRDP takes half an hour and changes when its version
      # does, while the shim takes seconds and changes often. A cache hit skips
      # the first and still rebuilds the second, so a change to our own C is
      # never served from a stale cache.
      - name: Cache the desktop client's dependencies
        if: matrix.freerdp != ''
        id: freerdp
        uses: actions/cache@v4
        with:
          path: |
            resources/freerdp/build
            resources/freerdp/vcpkg
          key: freerdp-3.31.0-${{ matrix.os }}-${{ hashFiles(matrix.recipe, 'resources/freerdp/shim/CMakeLists.txt') }}

      - name: Install what FreeRDP is built against
        if: matrix.freerdp == 'mac' && steps.freerdp.outputs.cache-hit != 'true'
        run: brew install cmake ninja pkg-config openssl@3 openh264 opus

      - name: Build the desktop client
        if: matrix.freerdp != '' && steps.freerdp.outputs.cache-hit != 'true'
        # Without the SDL client: it exists to prove a build by hand and is
        # never shipped, so a release has no use for it.
        env:
          FREERDP_SDL: '0'
        run: npm run build:freerdp:${{ matrix.freerdp }}

      # Always, and cheap: seconds against the FreeRDP the step above built or
      # the cache restored, so our own C is never the stale half of a hit.
      - name: Rebuild the shim
        if: matrix.freerdp != ''
        run: npm run ${{ matrix.shim }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Checks runs these on every push, so a tagged commit has usually been
      # through them already. Repeated here because this is the workflow that
      # publishes: a release should not be built from a tree whose tests fail,
      # whichever route the tag took.
      - name: Tests
        run: npm test

      # A missing secret expands to an empty string rather than being unset, and
      # electron-builder reads an empty CSC_LINK as a certificate path — failing
      # with "not a file". So the signing variables are only exported when set.
      - name: Configure signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the supplied certificate."
          else
            # Also stops electron-builder from hunting for an identity in the keychain.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No certificate configured — producing an unsigned build."
          fi
          if [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          # Provided by Actions; lets electron-builder upload to the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
