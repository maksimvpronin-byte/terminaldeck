name: Checks

# The release workflow only runs on a `v*` tag, so until this existed the first
# compile of a commit happened after the tag was already pushed — and the tests
# never ran at all unless someone remembered to type `npm test`. That matters
# here more than usual: the Windows paths (WinSessions, ntlm, md4, TsGateway,
# ShadowHostBridge, the named-pipe agent) are developed on a Mac and never
# execute there, so their tests are the only thing that can say they still work.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A quick series of pushes should leave one run to read, not a queue of them.
#
# Keyed on the branch name, which both events have to be made to say: a push
# reports `refs/heads/foo` in `github.ref` while a pull request reports `foo` in
# `head_ref`, so keying on either of those verbatim puts the two in different
# groups and the run this was written to prevent — the same commit built twice,
# once for the push and once for the pull request from a branch in this
# repository — happened anyway, quietly, for as long as the comment here said it
# did not. `ref_name` is `github.ref` with the `refs/heads/` already off.
concurrency:
  group: checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cheap: Electron 42 dropped its postinstall, so no 100 MB binary is
      # fetched here. That download happens under `npm run dev`, via
      # install-electron, and this job never runs the app.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Errors fail the job; `exhaustive-deps` is still a warning and does not,
      # which is why this step could be added the day the first run was read
      # rather than waiting for the rule to be promoted. `format:check` stays
      # out until the tree has been through Prettier once.
      - name: Lint
        run: npm run lint

      # One runner, not the release matrix: the tests are pure Node modules with
      # no platform branches. A three-OS matrix belongs here the day a platform
      # difference actually bites, not before.
      - name: Tests
        run: npm test

      # The bundle only — electron-vite, not electron-builder, so this is
      # seconds rather than the twenty minutes a packaged Windows build takes.
      # It is here because it fails on things the type-checker accepts: an
      # import Rollup cannot resolve, an asset path that does not survive the
      # build, a renderer entry that no longer exists. Until this step, the
      # first time a commit was bundled at all was after its tag had been
      # pushed, on the runner that was about to publish it.
      - name: Build
        run: npm run build
